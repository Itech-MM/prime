<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base-layout}">
<head>
<title>Goods Issue</title>
</head>
<body>
	<div layout:fragment="content">

		<input type="hidden" id="issueId" th:value="${issueDTO.id}">
		<input type="hidden" id="issueStatus" th:value="${issueDTO.status}">
		<input type="hidden" id="canEdit" th:value="${canEdit}">
		<input type="hidden" id="canApprove" th:value="${canApprove}">

		<div class="page-header d-flex justify-content-between align-items-start">
			<div>
				<h1 class="h3 mb-0 text-gray-800">
					Goods Issue
					<span th:if="${issueDTO.docNo}" class="text-muted" th:text="'- ' + ${issueDTO.docNo}"></span>
				</h1>
				<p class="text-muted mb-0">
					<span th:if="${issueDTO.statusDesc}" class="badge bg-info text-dark" th:text="${issueDTO.statusDesc}">Draft</span>
					<span th:unless="${issueDTO.statusDesc}" class="text-muted">New document</span>
				</p>
			</div>
			<a th:href="@{/inventory/stock-documents(tab='goods-issues')}" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left me-1"></i> Back to List</a>
		</div>
	<form id="goodsIssueForm" class="needs-validation" novalidate>
	
		<div class="card mb-3">
			<div class="card-header bg-white py-3"><h6 class="mb-0"><i class="fas fa-info-circle me-2 text-primary"></i>Issue Details</h6></div>
			<div class="card-body">
				<div class="row g-3">
					<div class="col-md-3">
						<label class="form-label fw-bold small">Warehouse <span class="text-danger">*</span></label>
						<select id="warehouseId" class="form-select" style="width:100%" required></select>
					</div>
					<div class="col-md-3">
						<label class="form-label fw-bold small">Issue Type <span class="text-danger">*</span></label>
						<select id="issueType" class="form-select" required>
							<option value="">Select Type</option>
							<option th:each="t : ${issueTypeList}" th:value="${t.code}" th:text="${t.desc}"></option>
						</select>
					</div>
					<div class="col-md-3" id="customerWrap">
						<label class="form-label fw-bold small">Customer</label>
						<select id="customerId" class="form-select" style="width:100%"></select>
					</div>
					<div class="col-md-3" id="issuedToWrap" style="display:none">
						<label class="form-label fw-bold small">Issued To</label>
						<input type="text" id="issuedToName" class="form-control">
					</div>
					<div class="col-md-4">
						<label class="form-label fw-bold small">Issue Date <span class="text-danger">*</span></label>
						<input type="date" id="issueDate" class="form-control" required="required">
					</div>
					<div class="col-md-8">
						<label class="form-label fw-bold small">Remarks</label>
						<input type="text" id="remarks" class="form-control">
					</div>
				</div>
			</div>
		</div>

		<div class="card mb-3">
			<div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
				<h6 class="mb-0"><i class="fas fa-list me-2 text-primary"></i>Line Items</h6>
				<button type="button" id="addLineBtn" class="btn btn-outline-primary btn-sm"><i class="fas fa-plus me-1"></i> Add Line</button>
			</div>
			<div class="card-body">
				<div id="linesContainer"></div>
				<div th:if="${#lists.isEmpty(issueDTO.lines)}" id="noLinesMsg" class="text-center text-muted py-3">No lines added yet</div>
				<div class="d-flex justify-content-end mt-3">
					<div class="text-end">
						<div class="text-muted small">Total Amount <span class="text-muted">(determined at posting)</span></div>
						<div class="h5 mb-0" id="grandTotal" th:text="${issueDTO.totalAmount} ?: '-'">-</div>
					</div>
				</div>
			</div>
		</div>
</form>
		<div class="d-flex justify-content-end gap-2 mb-4" id="actionBar">
			<button type="button" id="cancelDocBtn" class="btn btn-outline-danger"><i class="fas fa-ban me-1"></i> Cancel Document</button>
			<button type="button" id="deleteDocBtn" class="btn btn-outline-danger"><i class="fas fa-trash me-1"></i> Delete</button>
			<button type="button" id="saveDraftBtn" class="btn btn-outline-primary"><i class="fas fa-save me-1"></i> Save Draft</button>
			<button type="button" id="submitDocBtn" class="btn btn-primary"><i class="fas fa-paper-plane me-1"></i> Submit</button>
			<button type="button" id="approveDocBtn" class="btn btn-success"><i class="fas fa-check me-1"></i> Approve</button>
			<button type="button" id="postDocBtn" class="btn btn-success"><i class="fas fa-check-double me-1"></i> Post</button>
		</div>
	</div>

	<div layout:fragment="modals">
		<div class="modal fade" id="confirmActionModal" tabindex="-1">
			<div class="modal-dialog modal-dialog-centered">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title" id="confirmActionTitle">Confirm Action</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
					</div>
					<div class="modal-body" id="confirmActionBody">Are you sure?</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
						<button type="button" id="confirmActionBtn" class="btn btn-primary">Confirm</button>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div layout:fragment="scripts">
		<script th:inline="javascript">
			var EXISTING_ISSUE = /*[[${issueDTO}]]*/ null;
		</script>
		<script th:src="@{/js/inventory/stock/goods-issue-setup.js}"></script>
	</div>
</body>
</html>
