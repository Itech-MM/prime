<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base-layout}">
<head>
<title>Goods Receipt</title>
</head>
<body>
	<div layout:fragment="content">

		<input type="hidden" id="receiptId" th:value="${receiptDTO.id}">
		<input type="hidden" id="receiptStatus" th:value="${receiptDTO.status}">
		<input type="hidden" id="canEdit" th:value="${canEdit}">
		<input type="hidden" id="canApprove" th:value="${canApprove}">

		<div class="page-header d-flex justify-content-between align-items-start">
			<div>
				<h1 class="h3 mb-0 text-gray-800">
					Goods Receipt
					<span th:if="${receiptDTO.docNo}" class="text-muted" th:text="'- ' + ${receiptDTO.docNo}"></span>
				</h1>
				<p class="text-muted mb-0">
					<span th:if="${receiptDTO.statusDesc}" class="badge bg-info text-dark" th:text="${receiptDTO.statusDesc}">Draft</span>
					<span th:unless="${receiptDTO.statusDesc}" class="text-muted">New document</span>
				</p>
			</div>
			<a th:href="@{/inventory/stock-documents}" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left me-1"></i> Back to List</a>
		</div>

		<div class="card mb-3">
			<div class="card-header bg-white py-3"><h6 class="mb-0"><i class="fas fa-info-circle me-2 text-primary"></i>Receipt Details</h6></div>
			<div class="card-body">
				<div class="row g-3">
					<div class="col-md-4">
						<label class="form-label fw-bold small">Supplier <span class="text-danger">*</span></label>
						<select id="supplierId" class="form-select" style="width:100%" required></select>
					</div>
					<div class="col-md-4">
						<label class="form-label fw-bold small">Warehouse <span class="text-danger">*</span></label>
						<select id="warehouseId" class="form-select" style="width:100%" required></select>
					</div>
					<div class="col-md-4">
						<label class="form-label fw-bold small">Received Date</label>
						<input type="date" id="receivedDate" class="form-control">
					</div>
					<div class="col-md-6">
						<label class="form-label fw-bold small">Delivery Note No</label>
						<input type="text" id="deliveryNoteNo" class="form-control">
					</div>
					<div class="col-md-6">
						<label class="form-label fw-bold small">Remarks</label>
						<input type="text" id="remarks" class="form-control">
					</div>
				</div>
			</div>
		</div>

		<div class="card mb-3">
			<div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
				<h6 class="mb-0"><i class="fas fa-list me-2 text-primary"></i>Line Items</h6>
				<button type="button" id="addLineBtn" class="btn btn-outline-primary btn-sm"><i class="fas fa-plus me-1"></i> Add Line</button>
			</div>
			<div class="card-body">
				<div id="linesContainer"></div>
				<div th:if="${#lists.isEmpty(receiptDTO.lines)}" id="noLinesMsg" class="text-center text-muted py-3">No lines added yet</div>
				<div class="d-flex justify-content-end mt-3">
					<div class="text-end">
						<div class="text-muted small">Total Amount</div>
						<div class="h5 mb-0" id="grandTotal">0.00</div>
					</div>
				</div>
			</div>
		</div>

		<div class="d-flex justify-content-end gap-2 mb-4" id="actionBar">
			<button type="button" id="cancelDocBtn" class="btn btn-outline-danger"><i class="fas fa-ban me-1"></i> Cancel Document</button>
			<button type="button" id="deleteDocBtn" class="btn btn-outline-danger"><i class="fas fa-trash me-1"></i> Delete</button>
			<button type="button" id="saveDraftBtn" class="btn btn-outline-primary"><i class="fas fa-save me-1"></i> Save Draft</button>
			<button type="button" id="submitDocBtn" class="btn btn-primary"><i class="fas fa-paper-plane me-1"></i> Submit</button>
			<button type="button" id="approveDocBtn" class="btn btn-success"><i class="fas fa-check me-1"></i> Approve</button>
			<button type="button" id="postDocBtn" class="btn btn-success"><i class="fas fa-check-double me-1"></i> Post</button>
		</div>
	</div>

	<div layout:fragment="modals">
		<div class="modal fade" id="confirmActionModal" tabindex="-1">
			<div class="modal-dialog modal-dialog-centered">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title" id="confirmActionTitle">Confirm Action</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
					</div>
					<div class="modal-body" id="confirmActionBody">Are you sure?</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
						<button type="button" id="confirmActionBtn" class="btn btn-primary">Confirm</button>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div layout:fragment="scripts">
		<script th:inline="javascript">
			var EXISTING_RECEIPT = /*[[${receiptDTO}]]*/ null;
		</script>
		<script th:src="@{/js/inventory/stock/goods-receipt-setup.js}"></script>
	</div>
</body>
</html>
