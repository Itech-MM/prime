<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base-layout}">
<head>
<title>Warehouse Setup</title>
</head>
<body>
	<div layout:fragment="content">

		<input type="hidden" id="activeTab" th:value="${activeTab}">
		<input type="hidden" id="canEditWarehouse" th:value="${canEditWarehouse}">
		<input type="hidden" id="canEditLocation" th:value="${canEditLocation}">
		<input type="hidden" id="presetLocationEditId" th:value="${presetLocationEditId}">

		<div class="page-header d-flex justify-content-between align-items-start">
			<div>
				<h1 class="h3 mb-0 text-gray-800">Warehouse Setup</h1>
				<p class="text-muted mb-0">Manage warehouses and locations</p>
			</div>
			<a th:href="@{/inventory/warehouses}" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left me-1"></i> Back to List</a>
		</div>

		<div th:if="${errorMsg != null}" class="alert alert-danger alert-dismissible fade show">
			<i class="fas fa-exclamation-circle me-2"></i><span th:text="${errorMsg}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>

		<div class="card">
			<div class="card-header bg-white pt-3 pb-0 border-bottom-0">
				<ul class="nav nav-tabs border-bottom-0" id="setupTabs" role="tablist">
					<li th:replace="~{layouts/fragments/tab-nav :: tab-item(tabId='warehouses', label='Warehouse', icon='fas fa-warehouse', visible=${viewWarehouse}, active=${activeTab == 'warehouses'})}"></li>
					<li th:replace="~{layouts/fragments/tab-nav :: tab-item(tabId='locations', label='Location', icon='fas fa-map-marker-alt', visible=${viewLocation}, active=${activeTab == 'locations'})}"></li>
				</ul>
			</div>

			<div class="card-body">
				<div class="tab-content" id="setupTabContent">

					<div class="tab-pane fade" th:classappend="${activeTab == 'warehouses'} ? ' show active'" id="warehouses" role="tabpanel">
						<form th:action="@{/inventory/warehouses/setup}" th:object="${warehouseDTO}" method="post" class="needs-validation" id="warehouseForm">
							<input type="hidden" th:field="*{id}">
							<div class="row g-3">
								<div class="col-md-4">
									<label class="form-label fw-bold small">Code <span class="text-danger">*</span></label>
									<input type="text" th:field="*{code}" class="form-control" required>
									<div class="form-text text-danger small" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
								</div>
								<div class="col-md-8">
									<label class="form-label fw-bold small">Name <span class="text-danger">*</span></label>
									<input type="text" th:field="*{name}" class="form-control" required>
									<div class="form-text text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
								</div>
								<div class="col-md-6">
									<label class="form-label fw-bold small">Manager Name</label>
									<input type="text" th:field="*{managerName}" class="form-control">
								</div>
								<div class="col-md-6">
									<label class="form-label fw-bold small">Status <span class="text-danger">*</span></label>
									<select th:field="*{status}" class="form-select" required>
										<option value="">Select Status</option>
										<option th:each="s : ${statusList}" th:value="${s.code}" th:text="${s.desc}" th:selected="${s.code == warehouseDTO.status}"></option>
									</select>
								</div>
								<div class="col-12">
									<label class="form-label fw-bold small">Address</label>
									<textarea th:field="*{address}" class="form-control" rows="2"></textarea>
								</div>
								<div class="col-12">
									<div class="form-check">
										<input type="checkbox" th:field="*{allowNegativeStock}" class="form-check-input" id="allowNegativeStock">
										<label class="form-check-label small fw-bold" for="allowNegativeStock">Allow Negative Stock</label>
									</div>
								</div>
							</div>

							<div class="d-flex justify-content-end gap-2 mt-4">
								<a th:href="@{/inventory/warehouses}" class="btn btn-outline-secondary"><i class="fas fa-times me-1"></i> Cancel</a>
								<button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>
									<span th:text="${warehouseDTO.id != null} ? 'Update Warehouse' : 'Create Warehouse'">Save</span>
								</button>
							</div>
						</form>
					</div>

					<div class="tab-pane fade" th:classappend="${activeTab == 'locations'} ? ' show active'" id="locations" role="tabpanel">
						<div class="row">
							<div class="col-md-6">
								<form id="locationTabForm" class="needs-validation" novalidate th:attr="data-ajax-url=@{/inventory/locations/save}">
									<input type="hidden" id="locationTabId" data-field="id" data-type="number">
									<div class="mb-3">
										<label class="form-label fw-bold small">Warehouse <span class="text-danger">*</span></label>
										<select id="locationTabWarehouseId" data-field="warehouseId" data-type="number" class="form-select" style="width:100%" required></select>
										<div class="invalid-feedback d-block text-danger small" data-field-error="warehouseId"></div>
									</div>
									<div class="mb-3">
										<label class="form-label fw-bold small">Code <span class="text-danger">*</span></label>
										<input type="text" id="locationTabCode" data-field="code" class="form-control" maxlength="30" required>
										<div class="invalid-feedback d-block text-danger small" data-field-error="code"></div>
									</div>
									<div class="mb-3">
										<label class="form-label fw-bold small">Name <span class="text-danger">*</span></label>
										<input type="text" id="locationTabName" data-field="name" class="form-control" required>
										<div class="invalid-feedback d-block text-danger small" data-field-error="name"></div>
									</div>
									<div class="mb-3">
										<label class="form-label fw-bold small">Type <span class="text-danger">*</span></label>
										<select id="locationTabType" data-field="type" data-type="number" class="form-select" required>
											<option value="">Select Type</option>
											<option th:each="t : ${locationTypeList}" th:value="${t.code}" th:text="${t.desc}"></option>
										</select>
										<div class="invalid-feedback d-block text-danger small" data-field-error="type"></div>
									</div>
									<div class="mb-3">
										<label class="form-label fw-bold small">Parent Location</label>
										<select id="locationTabParentId" data-field="parentId" class="form-select" style="width:100%"></select>
										<div class="invalid-feedback d-block text-danger small" data-field-error="parentId"></div>
									</div>
									<div class="mb-3">
										<label class="form-label fw-bold small">Status <span class="text-danger">*</span></label>
										<select id="locationTabStatus" data-field="status" data-type="number" class="form-select" required></select>
										<div class="invalid-feedback d-block text-danger small" data-field-error="status"></div>
									</div>
									<div class="d-flex gap-2">
										<button type="button" id="locationTabClearBtn" class="btn btn-outline-secondary"><i class="fas fa-eraser me-1"></i> Clear</button>
										<button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i> Save Location</button>
									</div>
								</form>
							</div>
						</div>
					</div>

				</div>
			</div>
		</div>
	</div>

	<div layout:fragment="scripts">
		<script th:src="@{/js/common/ajax-form-submit.js}"></script>
		<script th:src="@{/js/inventory/warehouse/setup.js}"></script>
	</div>
</body>
</html>
