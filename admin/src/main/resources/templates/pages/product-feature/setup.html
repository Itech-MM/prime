<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base-layout}">
<head>
    <title th:text="${featureDTO.id != null} ? 'Update Product Feature' : 'Product Feature Setup'">Product Feature Setup</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="page-header">
            <h1 class="h3 mb-0 text-gray-800" th:text="${featureDTO.id != null} ? 'Update Product Feature' : 'Product Feature Setup'">Product Feature Setup</h1>
            <p class="text-muted mb-0" th:text="${featureDTO.id != null} ? 'Update existing feature information' : 'Create new product feature'">Create new product feature</p>
        </div>

        <div th:if="${param.error != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${param.error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div th:if="${errorMsg != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${errorMsg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div th:if="${param.success != null}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${param.success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="row justify-content-start">
            <div class="col-lg-12">
                <div class="card">
                    <div class="card-header bg-white py-3">
                        <h5 class="card-title mb-0">
                            <i class="fas fa-list me-2 text-primary"></i>
                            <span th:text="${featureDTO.id != null} ? 'Update Product Feature' : 'Create New Product Feature'">Create New Product Feature</span>
                        </h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/product-features/setup}" th:object="${featureDTO}" method="post" id="featureForm" class="needs-validation">
                            <input type="hidden" th:field="*{id}">

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="name" class="form-label fw-bold small text-dark">
                                        Name <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" th:field="*{name}" class="form-control" id="name" placeholder="Enter feature name" required>
                                    <div class="form-text text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label for="code" class="form-label fw-bold small text-dark">
                                        Code <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" th:field="*{code}" class="form-control" id="code" placeholder="Enter feature code" required>
                                    <div class="form-text text-danger small" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
                                </div>
                            </div>

                            <div class="row mt-4">
                                <div class="col-12">
                                    <div class="d-flex justify-content-end gap-2">
                                        <a th:href="@{/product-features}" class="btn btn-outline-secondary">
                                            <i class="fas fa-arrow-left me-1"></i> Back to List
                                        </a>
                                        <button type="button" class="btn btn-outline-secondary" onclick="clearForm()">
                                            <i class="fas fa-redo me-1"></i> Clear
                                        </button>
                                        <button type="submit" class="btn btn-primary">
                                            <i class="fas fa-save me-1"></i>
                                            <span th:text="${featureDTO.id != null} ? 'Update Feature' : 'Create Feature'">Create Feature</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div layout:fragment="scripts">
        <script>
            $(document).ready(function() {
                $('#featureForm').on('submit', function(e) {
                    let isValid = true;
                    const requiredFields = ['#name', '#code'];

                    requiredFields.forEach(field => {
                        const element = $(field);
                        if (!element.val().trim()) {
                            element.addClass('is-invalid');
                            isValid = false;
                        } else {
                            element.removeClass('is-invalid');
                        }
                    });

                    if (!isValid) {
                        e.preventDefault();
                        showToast('Please fill all required fields', 'error');
                    }
                });

                $('input').on('input', function() {
                    if ($(this).val().trim()) {
                        $(this).removeClass('is-invalid');
                    }
                });
            });

            function clearForm() {
                $('#featureForm')[0].reset();
                $('input').removeClass('is-invalid');
                showToast('Form cleared', 'info');
            }
        </script>
    </div>
</body>
</html>
