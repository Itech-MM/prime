<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base-layout}">
<head>
    <title>System Settings</title>
    <th:block layout:fragment="page-css">
        <style>
            .setting-card {
                border: none;
                border-radius: 14px;
                transition: transform .15s ease, box-shadow .15s ease;
            }
            .setting-card:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 20px rgba(0,0,0,.08) !important;
            }
            .setting-icon {
                width: 42px; height: 42px;
                border-radius: 10px;
                background: #eef2ff;
                color: #4f46e5;
                display: flex; align-items: center; justify-content: center;
                font-size: 16px;
            }
            .setting-code { font-weight: 600; font-size: .95rem; }
            .setting-desc { font-size: .8rem; color: #6c757d; }
            .setting-updated { font-size: .72rem; color: #adb5bd; }
            .input-wrap { min-width: 260px; }
            .form-switch .form-check-input { width: 2.6em; height: 1.4em; cursor: pointer; }
            .badge-readonly { font-size: .7rem; }
            .toggle-password { cursor: pointer; }
        </style>
    </th:block>
</head>
<body>
<div layout:fragment="content"
     th:with="canEdit=${@menuSecurity.checkMenuEdit('SETTINGS')}, 
               canView=${@menuSecurity.checkMenuView('SETTINGS')},
               canDelete=${@menuSecurity.checkMenuDelete('SETTINGS')}">

    <input type="hidden" id="canEdit" th:value="${canEdit}">
    <input type="hidden" id="canDelete" th:value="${canDelete}">

    <th:block th:if="${canEdit or canView}">
        <div class="container py-5">
            <div class="d-flex align-items-center justify-content-between mb-4">
                <div>
                    <h4 class="mb-0"><i class="fas fa-sliders-h text-primary me-2"></i>System Settings</h4>
                    <p class="text-muted mb-0">Manage application configuration values</p>
                </div>
                <button th:if="${canEdit}" type="button" class="btn btn-primary px-4" id="saveSettingsBtn">
                    <i class="fas fa-save me-1"></i> Save Changes
                </button>
            </div>

            <div id="settingForm">
                <div class="card setting-card shadow-sm mb-3"
                     th:each="setting, iStat : ${dto.settings}">
                    <div class="card-body d-flex align-items-center justify-content-between flex-wrap gap-3">

                        <div class="d-flex align-items-center gap-3">
                            <div class="setting-icon">
                                <i class="" th:classappend="${setting.icon}"></i>
                            </div>
                            <div>
                                <div class="setting-code">
                                    <span th:text="${setting.code}">CODE</span>
                                    <span class="badge bg-secondary-subtle text-secondary badge-readonly ms-1"
                                          th:if="${setting.editableStatus == 0}">
                                        <i class="fas fa-lock fa-xs"></i> read-only
                                    </span>
                                </div>
                                <div class="setting-desc" th:text="${setting.description}">description</div>
                                <div class="setting-updated" th:if="${setting.updatedByName != null}">
                                    <i class="fas fa-user-clock me-1"></i>Updated by
                                    <span th:text="${setting.updatedByName}">name</span>
                                    <span th:if="${setting.updatedTime != null}" th:text="'· ' + ${setting.updatedTime}"> · date</span>
                                </div>
                            </div>
                        </div>

                        <div class="input-wrap">
                            <div class="input-group" th:if="${setting.inputType == 1}">
                                <span class="input-group-text bg-white"><i class="fas fa-i-cursor text-muted"></i></span>
                                <input type="text"
                                       class="form-control setting-value"
                                       th:value="${setting.value}"
                                       th:data-id="${setting.id}"
                                       th:data-original="${setting.value}"
                                       th:disabled="${setting.editableStatus == 0 || !canEdit}"
                                       placeholder="Enter value" />
                            </div>

                            <div class="input-group" th:if="${setting.inputType == 2}">
                                <span class="input-group-text bg-white"><i class="fas fa-hashtag text-muted"></i></span>
                                <input type="number"
                                       class="form-control setting-value"
                                       th:value="${setting.value}"
                                       th:data-id="${setting.id}"
                                       th:data-original="${setting.value}"
                                       th:disabled="${setting.editableStatus == 0 || !canEdit}" />
                            </div>

                            <div class="form-check form-switch d-flex justify-content-end" th:if="${setting.inputType == 3}">
                                <input class="form-check-input toggle-input" type="checkbox" role="switch"
                                       th:id="${'toggle_' + iStat.index}"
                                       th:checked="${setting.value == '1'}"
                                       th:disabled="${setting.editableStatus == 0 || !canEdit}"
                                       th:attr="onchange=|document.getElementById('hidden_${iStat.index}').value = this.checked ? '1' : '0';|" />
                                <input type="hidden"
                                       class="setting-value"
                                       th:id="${'hidden_' + iStat.index}"
                                       th:value="${setting.value}"
                                       th:data-id="${setting.id}"
                                       th:data-original="${setting.value}" />
                            </div>

                            <div class="input-group" th:if="${setting.inputType == 4}">
                                <span class="input-group-text bg-white"><i class="fas fa-calendar-alt text-muted"></i></span>
                                <input type="date"
                                       class="form-control setting-value"
                                       th:value="${setting.value}"
                                       th:data-id="${setting.id}"
                                       th:data-original="${setting.value}"
                                       th:disabled="${setting.editableStatus == 0 || !canEdit}" />
                            </div>

                            <div class="input-group" th:if="${setting.inputType == 5}">
                                <span class="input-group-text bg-white"><i class="fas fa-lock text-muted"></i></span>
                                <input type="password"
                                       class="form-control pw-input setting-value"
                                       th:value="${setting.value}"
                                       th:data-id="${setting.id}"
                                       th:data-original="${setting.value}"
                                       th:disabled="${setting.editableStatus == 0 || !canEdit}" />
                                <span class="input-group-text bg-white toggle-password">
                                    <i class="fas fa-eye"></i>
                                </span>
                            </div>

                            <div class="input-group"
                                 th:unless="${setting.inputType != null and setting.inputType >= 1 and setting.inputType <= 5}">
                                <input type="text"
                                       class="form-control setting-value"
                                       th:value="${setting.value}"
                                       th:data-id="${setting.id}"
                                       th:data-original="${setting.value}"
                                       th:disabled="${setting.editableStatus == 0 || !canEdit}" />
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </th:block>

    <th:block th:unless="${canEdit or canView}">
        <div class="container-fluid py-4">
            <div class="text-center py-5">
                <i class="fas fa-lock display-1 text-muted mb-3"></i>
                <p class="text-muted">You do not have permission to view or manage system settings.</p>
            </div>
        </div>
    </th:block>

</div>

<th:block layout:fragment="scripts">
    <script th:inline="javascript">
        /*<![CDATA[*/
        $(document).ready(function() {
            const batchUpdateUrl = /*[[@{/settings/batch-update}]]*/ '/settings/batch-update';

            document.querySelectorAll('.toggle-password').forEach(function (el) {
                el.addEventListener('click', function () {
                    const input = el.closest('.input-group').querySelector('.pw-input');
                    const icon = el.querySelector('i');
                    if (input.type === 'password') {
                        input.type = 'text';
                        icon.classList.replace('fa-eye', 'fa-eye-slash');
                    } else {
                        input.type = 'password';
                        icon.classList.replace('fa-eye-slash', 'fa-eye');
                    }
                });
            });

            $('#saveSettingsBtn').on('click', function() {
                let settingsToUpdate = [];
                let hasChanges = false;

                $('.setting-value').each(function() {
                    const $input = $(this);
                    if ($input.is(':disabled')) return;

                    const originalValue = String($input.data('original') ?? '');
                    const currentValue = String($input.val() ?? '');
                    const settingId = $input.data('id');

                    if (originalValue !== currentValue) {
                        hasChanges = true;
                        settingsToUpdate.push({
                            id: settingId,
                            value: currentValue
                        });
                    }
                });

                if (!hasChanges) {
                    if (typeof showToast === 'function') {
                        showToast('No changes to save', 'info');
                    } else {
                        alert('No changes to save');
                    }
                    return;
                }

                const $btn = $(this);
                const originalText = $btn.html();
                $btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin me-1"></i> Saving...');

                $.ajax({
                    url: batchUpdateUrl,
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(settingsToUpdate),
                    success: function(response) {
                        if (typeof showSuccess === 'function') {
                            showSuccess('Settings updated successfully!');
                        }
                        setTimeout(function() {
                            window.location.href = window.location.pathname + '?success=Settings+updated+successfully';
                        }, 1000);
                    },
                    error: function(xhr) {
                        let errorMsg = 'Update failed. Please try again.';
                        if (xhr.responseJSON && xhr.responseJSON.message) {
                            errorMsg = xhr.responseJSON.message;
                        } else if (xhr.status === 400) {
                            errorMsg = 'Invalid data submitted.';
                        }
                        if (typeof showError === 'function') {
                            showError(errorMsg);
                        } else {
                            alert(errorMsg);
                        }
                    },
                    complete: function() {
                        $btn.prop('disabled', false).html(originalText);
                    }
                });
            });
        });
        /*]]>*/
    </script>
</th:block>
</body>
</html>
