<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base-layout}">
<head>
    <title th:text="${roleDTO.id != null} ? 'Update Role' : 'Role Setup'">Role Setup</title>
</head>
<body>
<div layout:fragment="content">

    <th:block
        th:with="canEdit=${@menuSecurity.checkMenuEdit('ROLE_LIST')}, 
                  canDelete=${@menuSecurity.checkMenuDelete('ROLE_LIST')}">
        <input type="hidden" id="canEdit" th:value="${canEdit}">
        <input type="hidden" id="canDelete" th:value="${canDelete}">
    </th:block>

    <div class="page-header">
        <h1 class="h3 mb-0 text-gray-800" th:text="${roleDTO.id != null} ? 'Update Role' : 'Role Setup'"></h1>
        <p class="text-muted mb-0" th:text="${roleDTO.id != null} ? 'Update existing role information' : 'Create new roles for user assignment'"></p>
    </div>

    <div th:if="${param.error != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fas fa-exclamation-circle me-2"></i>
        <span th:text="${param.error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${param.success != null}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fas fa-check-circle me-2"></i>
        <span th:text="${param.success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row justify-content-start" th:if="${@menuSecurity.checkMenuEdit('ROLE_LIST')}">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-header bg-white py-3">
                    <h6 class="card-title mb-0">
                        <i class="fas fa-user-shield me-2 text-primary"></i>
                        <span th:text="${roleDTO.id != null} ? 'Update Role' : 'Create New Role'"></span>
                    </h6>
                </div>
                <div class="card-body">
                    <form th:action="@{/roles}" th:object="${roleDTO}" method="post" id="roleForm">
                        <input type="hidden" th:field="*{id}">

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="name" class="form-label fw-bold small text-dark">
                                    Role Name <span class="text-danger">*</span>
                                </label>
                                <input type="text"
                                       th:field="*{name}"
                                       class="form-control"
                                       id="name"
                                       placeholder="Enter role name"
                                       required>
                                <div class="form-text text-danger small"
                                     th:if="${#fields.hasErrors('name')}"
                                     th:errors="*{name}"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="code" class="form-label fw-bold small text-dark">
                                    Role Code <span class="text-danger">*</span>
                                </label>
                                <input type="text"
                                       th:field="*{code}"
                                       class="form-control"
                                       id="code"
                                       placeholder="Enter unique role code"
                                       required>
                                <div class="form-text text-danger small"
                                     th:if="${#fields.hasErrors('code')}"
                                     th:errors="*{code}"></div>
                            </div>
                        </div>

                        <div class="row mt-4">
                            <div class="col-12 d-flex justify-content-end gap-2">
                                <button type="button" class="btn btn-outline-secondary" onclick="clearForm()">
                                    <i class="fas fa-redo me-1"></i> Clear
                                </button>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save me-1"></i>
                                    <span th:text="${roleDTO.id != null} ? 'Update Role' : 'Create Role'"></span>
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-header bg-white py-3">
                    <h6 class="card-title mb-0"><i class="fas fa-list me-2 text-primary"></i>Existing Roles</h6>
                </div>
                <div class="card-body">
                    <table class="table table-bordered align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Role Name</th>
                            <th>Code</th>
                            <th>Created Time</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="role, iter : ${roleList}">
                            <td th:text="${iter.index + 1}"></td>
                            <td th:text="${role.name}"></td>
                            <td th:text="${role.code}"></td>
                            <td th:text="${role.createdTime}"></td>
                            <td>
                                <a th:if="${@menuSecurity.checkMenuEdit('ROLE_LIST')}"
                                   th:href="@{/roles(id=${role.id})}"
                                   class="btn btn-sm btn-outline-primary">
                                    <i class="fas fa-edit"></i> Edit
                                </a>
                                <span th:unless="${@menuSecurity.checkMenuEdit('ROLE_LIST')}"
                                      class="text-muted">No actions</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(roleList)}">
                            <td colspan="5" class="text-center text-muted">No roles found</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</div>

<div layout:fragment="scripts">
    <script>
        $(document).ready(function () {
            if ($('#roleForm').length) {
                $('#roleForm').on('submit', function (e) {
                    let isValid = true;
                    ['#name', '#code'].forEach(function (field) {
                        const el = $(field);
                        if (!el.val().trim()) {
                            el.addClass('is-invalid');
                            isValid = false;
                        } else {
                            el.removeClass('is-invalid');
                        }
                    });
                    if (!isValid) {
                        e.preventDefault();
                        showToast('Please fill all required fields', 'error');
                    }
                });
            }

            $('input').on('input', function () {
                $(this).removeClass('is-invalid');
            });
        });

        function clearForm() {
            var form = $('#roleForm');
            if (form.length) {
                form[0].reset();
                $('input').removeClass('is-invalid');
                showToast('Form cleared', 'info');
            }
        }
    </script>
</div>
</body>
</html>
