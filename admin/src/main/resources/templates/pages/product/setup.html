<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base-layout}">
<head>
    <title th:text="${productDTO.id != null} ? 'Update Product' : 'Product Setup'">Product Setup</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="page-header">
            <h1 class="h3 mb-0 text-gray-800" th:text="${productDTO.id != null} ? 'Update Product' : 'Product Setup'">Product Setup</h1>
            <p class="text-muted mb-0" th:text="${productDTO.id != null} ? 'Update existing product information' : 'Create new product'">Create new product</p>
        </div>

        <div th:if="${param.error != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${param.error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div th:if="${errorMsg != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${errorMsg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div th:if="${param.success != null}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${param.success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="row justify-content-start">
            <div class="col-lg-12">
                <div class="card">
                    <div class="card-header bg-white py-3">
                        <h5 class="card-title mb-0">
                            <i class="fas fa-box me-2 text-primary"></i>
                            <span th:text="${productDTO.id != null} ? 'Update Product' : 'Create New Product'">Create New Product</span>
                        </h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/products/setup}" th:object="${productDTO}" method="post" id="productForm" class="needs-validation">
                            <input type="hidden" th:field="*{id}">

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="name" class="form-label fw-bold small text-dark">
                                        Name <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" th:field="*{name}" class="form-control" id="name" placeholder="Enter product name" required>
                                    <div class="form-text text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label for="code" class="form-label fw-bold small text-dark">
                                        Code <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" th:field="*{code}" class="form-control" id="code" placeholder="Enter product code" required>
                                    <div class="form-text text-danger small" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="status" class="form-label fw-bold small text-dark">
                                        Status <span class="text-danger">*</span>
                                    </label>
                                    <select th:field="*{status}" class="form-select" id="status" required>
                                        <option value="">Select Status</option>
                                        <option th:each="status : ${statusList}"
                                                th:value="${status.code}"
                                                th:text="${status.desc}"
                                                th:selected="${status.code == productDTO.status}">
                                        </option>
                                    </select>
                                    <div class="form-text text-danger small" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="featureIds" class="form-label fw-bold small text-dark">
                                        Features
                                    </label>
                                    <select th:field="*{featureIds}" class="form-select" id="featureIds" multiple>
                                        <option th:each="feature : ${productDTO.features}"
                                                th:value="${feature.id}"
                                                th:text="${feature.name}"
                                                selected>
                                        </option>
                                    </select>
                                </div>
                            </div>

                            <div class="row mb-3" th:if="${productDTO.id != null}">
                                <div class="col-12">
                                    <div class="card bg-light">
                                        <div class="card-body">
                                            <h6 class="card-title">
                                                <i class="fas fa-key me-2 text-primary"></i>License Key Information
                                            </h6>
                                            <div class="row">
                                                <div class="col-md-4">
                                                    <p class="mb-1 small text-muted">Algorithm</p>
                                                    <p th:text="${productDTO.keyAlgorithm} ?: '-'">-</p>
                                                </div>
                                                <div class="col-md-4">
                                                    <p class="mb-1 small text-muted">Key Status</p>
                                                    <p th:text="${productDTO.keyStatusDesc} ?: '-'">-</p>
                                                </div>
                                                <div class="col-md-4">
                                                    <p class="mb-1 small text-muted">Generated At</p>
                                                    <p th:text="${productDTO.keyGeneratedAt} ?: '-'">-</p>
                                                </div>
                                            </div>
                                            <a th:if="${productDTO.publicKeyLocation != null}"
                                               th:href="@{'/products/' + ${productDTO.id} + '/public-key/download'}"
                                               class="btn btn-outline-primary btn-sm">
                                                <i class="fas fa-download me-1"></i> Download Public Key
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="row mt-4">
                                <div class="col-12">
                                    <div class="d-flex justify-content-end gap-2">
                                        <a th:href="@{/products}" class="btn btn-outline-secondary">
                                            <i class="fas fa-arrow-left me-1"></i> Back to List
                                        </a>
                                        <button type="button" class="btn btn-outline-secondary" onclick="clearForm()">
                                            <i class="fas fa-redo me-1"></i> Clear
                                        </button>
                                        <button type="submit" class="btn btn-primary">
                                            <i class="fas fa-save me-1"></i>
                                            <span th:text="${productDTO.id != null} ? 'Update Product' : 'Create Product'">Create Product</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div layout:fragment="scripts">
        <script>
            $(document).ready(function() {

                $('#featureIds').select2({
                    width: '100%',
                    placeholder: 'Search and select features',
                    ajax: {
                        url: CONTEXT_PATH + 'product-features/select2',
                        dataType: 'json',
                        delay: 250,
                        data: function(params) {
                            return {
                                q: params.term,
                                page: params.page || 0
                            };
                        },
                        processResults: function(data) {
                            return data;
                        },
                        cache: true
                    },
                    minimumInputLength: 0
                });
            	
                $('#productForm').on('submit', function(e) {
                    let isValid = true;
                    const requiredFields = ['#name', '#code', '#status'];

                    requiredFields.forEach(field => {
                        const element = $(field);
                        if (!element.val().trim()) {
                            element.addClass('is-invalid');
                            isValid = false;
                        } else {
                            element.removeClass('is-invalid');
                        }
                    });

                    if (!isValid) {
                        e.preventDefault();
                        showToast('Please fill all required fields', 'error');
                    }
                });

                $('input, select').on('input change', function() {
                    if ($(this).val().trim()) {
                        $(this).removeClass('is-invalid');
                    }
                });
            });

            function clearForm() {
                $('#productForm')[0].reset();
                $('input, select').removeClass('is-invalid');
                showToast('Form cleared', 'info');
            }
        </script>
    </div>
</body>
</html>
