<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/base-layout}">
<head>
<title
	th:text="${planDTO.id != null} ? 'Update License Plan' : 'License Plan Setup'">License
	Plan Setup</title>
</head>
<body>
	<div layout:fragment="content">
		<div class="page-header">
			<h1 class="h3 mb-0 text-gray-800"
				th:text="${planDTO.id != null} ? 'Update License Plan' : 'License Plan Setup'">License
				Plan Setup</h1>
			<p class="text-muted mb-0"
				th:text="${planDTO.id != null} ? 'Update existing license plan' : 'Create new license plan'">Create
				new license plan</p>
		</div>

		<div th:if="${param.error != null}"
			class="alert alert-danger alert-dismissible fade show" role="alert">
			<i class="fas fa-exclamation-circle me-2"></i> <span
				th:text="${param.error}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"
				aria-label="Close"></button>
		</div>

		<div th:if="${errorMsg != null}"
			class="alert alert-danger alert-dismissible fade show" role="alert">
			<i class="fas fa-exclamation-circle me-2"></i> <span
				th:text="${errorMsg}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"
				aria-label="Close"></button>
		</div>

		<div th:if="${param.success != null}"
			class="alert alert-success alert-dismissible fade show" role="alert">
			<i class="fas fa-check-circle me-2"></i> <span
				th:text="${param.success}"></span>
			<button type="button" class="btn-close" data-bs-dismiss="alert"
				aria-label="Close"></button>
		</div>

		<div class="row justify-content-start">
			<div class="col-lg-12">
				<div class="card">
					<div class="card-header bg-white py-3">
						<h5 class="card-title mb-0">
							<i class="fas fa-layer-group me-2 text-primary"></i> <span
								th:text="${planDTO.id != null} ? 'Update License Plan' : 'Create New License Plan'">Create
								New License Plan</span>
						</h5>
					</div>
					<div class="card-body">
						<form th:action="@{/license-plans/setup}" th:object="${planDTO}"
							method="post" id="planForm" class="needs-validation">
							<input type="hidden" th:field="*{id}">

							<div class="row mb-3">
								<div class="col-md-6">
									<label for="productId"
										class="form-label fw-bold small text-dark"> Product <span
										class="text-danger">*</span>
									</label> <select th:field="*{productId}" class="form-select"
										id="productId" style="width: 100%;" required>
										<option th:if="${planDTO.productId != null}"
											th:value="${planDTO.productId}"
											th:text="${planDTO.productName} + ' (' + ${planDTO.productCode} + ')'"
											selected></option>
									</select>
									<div class="form-text text-danger small"
										th:if="${#fields.hasErrors('productId')}"
										th:errors="*{productId}"></div>
								</div>

								<div class="col-md-6">
									<label for="status" class="form-label fw-bold small text-dark">
										Status <span class="text-danger">*</span>
									</label> <select th:field="*{status}" class="form-select" id="status"
										required>
										<option value="">Select Status</option>
										<option th:each="status : ${statusList}"
											th:value="${status.code}" th:text="${status.desc}"
											th:selected="${status.code == planDTO.status}"></option>
									</select>
									<div class="form-text text-danger small"
										th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
								</div>
							</div>

							<div class="row mb-3">
								<div class="col-md-6">
									<label for="name" class="form-label fw-bold small text-dark">
										Name <span class="text-danger">*</span>
									</label> <input type="text" th:field="*{name}" class="form-control"
										id="name" placeholder="Enter plan name" required>
									<div class="form-text text-danger small"
										th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
								</div>

								<div class="col-md-6">
									<label for="code" class="form-label fw-bold small text-dark">
										Code <span class="text-danger">*</span>
									</label> <input type="text" th:field="*{code}" class="form-control"
										id="code" placeholder="Enter plan code" required>
									<div class="form-text text-danger small"
										th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
								</div>
							</div>

							<div class="row mb-3">
								<div class="col-md-2">
									<label for="durationDays"
										class="form-label fw-bold small text-dark"> Duration
										(days) <span class="text-danger">*</span>
									</label> <input type="number" th:field="*{durationDays}"
										class="form-control" id="durationDays" min="1" required>
								</div>
								<div class="col-md-2">
									<label for="price" class="form-label fw-bold small text-dark">
										Price <span class="text-danger">*</span>
									</label> <input type="number" th:field="*{price}" class="form-control"
										id="price" min="0" step="0.01" required>
								</div>
								<div class="col-md-2">
									<label for="maxActivations"
										class="form-label fw-bold small text-dark">Max
										Activations</label> <input type="number" th:field="*{maxActivations}"
										class="form-control" id="maxActivations" min="0">
								</div>
								<div class="col-md-2">
									<label for="maxClients"
										class="form-label fw-bold small text-dark">Max Clients</label>
									<input type="number" th:field="*{maxClients}"
										class="form-control" id="maxClients" min="0">
								</div>
								<div class="col-md-2">
									<label for="maxSites"
										class="form-label fw-bold small text-dark">Max Sites</label> <input
										type="number" th:field="*{maxSites}" class="form-control"
										id="maxSites" min="0">
								</div>
								<div class="col-md-2">
									<label for="maxGates"
										class="form-label fw-bold small text-dark">Max Gates</label> <input
										type="number" th:field="*{maxGates}" class="form-control"
										id="maxGates" min="0">
								</div>
							</div>

							<div class="row mb-3">
								<div class="col-12">
									<label for="featureIds"
										class="form-label fw-bold small text-dark"> Features </label>
									<select th:field="*{featureIds}" class="form-select"
										id="featureIds" style="width: 100%;" multiple>
										<option th:each="feature : ${planDTO.features}"
											th:value="${feature.id}" th:text="${feature.name}" selected>
										</option>
									</select>
									<div class="form-text text-muted small" id="featureHint"
										th:if="${planDTO.productId == null}">Select a product
										first to choose features.</div>
								</div>
							</div>

							<div class="row mt-4">
								<div class="col-12">
									<div class="d-flex justify-content-end gap-2">
										<a th:href="@{/license-plans}"
											class="btn btn-outline-secondary"> <i
											class="fas fa-arrow-left me-1"></i> Back to List
										</a>
										<button type="button" class="btn btn-outline-secondary"
											onclick="clearForm()">
											<i class="fas fa-redo me-1"></i> Clear
										</button>
										<button type="submit" class="btn btn-primary">
											<i class="fas fa-save me-1"></i> <span
												th:text="${planDTO.id != null} ? 'Update Plan' : 'Create Plan'">Create
												Plan</span>
										</button>
									</div>
								</div>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div layout:fragment="scripts">
		<script th:inline="javascript">
            let selectedProductId = /*[[${planDTO.productId}]]*/ null;

            function initFeatureSelect2(productId) {
                $('#featureIds').select2({
                    width: '100%',
                    placeholder: 'Select features for this product',
                    ajax: {
                        url: CONTEXT_PATH + 'license-plans/features/select2',
                        dataType: 'json',
                        delay: 250,
                        data: function(params) {
                            return {
                                productId: selectedProductId,
                                q: params.term,
                                page: params.page || 0
                            };
                        },
                        processResults: function(data) {
                            return data;
                        },
                        cache: true
                    },
                    minimumInputLength: 0
                });
            }

            $(document).ready(function() {
                $('#productId').select2({
                    width: '100%',
                    placeholder: 'Search for a product',
                    ajax: {
                        url: CONTEXT_PATH + 'license-plans/products/select2',
                        dataType: 'json',
                        delay: 250,
                        data: function(params) {
                            return { q: params.term, page: params.page || 0 };
                        },
                        processResults: function(data) {
                            return data;
                        },
                        cache: true
                    },
                    minimumInputLength: 0
                });

                initFeatureSelect2(selectedProductId);
                $('#featureIds').prop('disabled', !selectedProductId);

                $('#productId').on('change', function() {
                    const newProductId = $(this).val();
                    if (newProductId !== selectedProductId) {
                        selectedProductId = newProductId;
                        $('#featureIds').val(null).trigger('change');
                        $('#featureIds').prop('disabled', !selectedProductId);
                    }
                });

                $('#planForm').on('submit', function(e) {
                    let isValid = true;
                    const requiredFields = ['#name', '#code', '#status', '#durationDays'];

                    requiredFields.forEach(field => {
                        const element = $(field);
                        if (!element.val() || !element.val().toString().trim()) {
                            element.addClass('is-invalid');
                            isValid = false;
                        } else {
                            element.removeClass('is-invalid');
                        }
                    });

                    if (!$('#productId').val()) {
                        showToast('Please select a product', 'error');
                        isValid = false;
                    }

                    if (!isValid) {
                        e.preventDefault();
                        if ($('#productId').val()) {
                            showToast('Please fill all required fields', 'error');
                        }
                    }
                });

                $('input, select').on('input change', function() {
                    if ($(this).val() && $(this).val().toString().trim()) {
                        $(this).removeClass('is-invalid');
                    }
                });
            });

            function clearForm() {
                $('#planForm')[0].reset();
                $('#productId').val(null).trigger('change');
                $('#featureIds').val(null).trigger('change');
                $('input, select').removeClass('is-invalid');
                showToast('Form cleared', 'info');
            }
        </script>
	</div>
</body>
</html>
